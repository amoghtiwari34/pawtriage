<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 540" role="img" aria-label="Training and evaluation pipeline" xmlns="http://www.w3.org/2000/svg" width="1000" height="540"><style>
.bgr{fill:#ffffff}
.b{fill:#ffffff;stroke:#111111;stroke-width:1.3}
.b.heavy{stroke-width:2.6}
.b.dash,.a.dash{stroke-dasharray:5 4}
.g{fill:none;stroke:#777777;stroke-width:1;stroke-dasharray:2 4}
.gl{font:600 11px Menlo,Consolas,monospace;letter-spacing:.12em;fill:#666666}
.t{font:700 14px "Helvetica Neue",Helvetica,Arial,sans-serif;fill:#111111}
.s{font:400 12.5px "Helvetica Neue",Helvetica,Arial,sans-serif;fill:#555555}
.a{fill:none;stroke:#111111;stroke-width:1.4}
.ahp{fill:#111111}
.al{font:400 12px "Helvetica Neue",Helvetica,Arial,sans-serif;fill:#111111}
.lblbg{fill:#ffffff}
.life{stroke:#888888;stroke-width:1;stroke-dasharray:3 5}
</style><rect class="bgr" x="0" y="0" width="1000" height="540"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="b " x="10" y="40" width="170" height="96" rx="6"/>
<text class="t" x="22" y="62">Vet rubric</text>
<text class="s" x="22" y="81">43 scenarios: urgency,</text>
<text class="s" x="22" y="98">conditions, red flags, plan</text>
<text class="s" x="22" y="115">(Merck, ASPCA, AAHA)</text>
<rect class="b " x="210" y="40" width="190" height="96" rx="6"/>
<text class="t" x="222" y="62">Text generation</text>
<text class="s" x="222" y="81">Kimi K3 writes messages;</text>
<text class="s" x="222" y="98">labels always come from</text>
<text class="s" x="222" y="115">the rubric row</text>
<rect class="b " x="210" y="160" width="190" height="96" rx="6"/>
<text class="t" x="222" y="182">Photo questions</text>
<text class="s" x="222" y="201">1,264 skin photos, 8 classes</text>
<text class="s" x="222" y="218">one generic message each,</text>
<text class="s" x="222" y="235">so text can&#x27;t leak the label</text>
<rect class="b heavy " x="430" y="40" width="190" height="216" rx="6"/>
<text class="t" x="442" y="62">Split</text>
<text class="s" x="442" y="81">text: split by scenario 80/20</text>
<text class="s" x="442" y="98">photos: rotation-invariant</text>
<text class="s" x="442" y="115">perceptual-hash groups, so no</text>
<text class="s" x="442" y="132">near-duplicate spans the split</text>
<text class="s" x="442" y="149"></text>
<text class="s" x="442" y="166">asserted in code: no overlap</text>
<rect class="b heavy " x="650" y="40" width="170" height="96" rx="6"/>
<text class="t" x="662" y="62">Locked test set</text>
<text class="s" x="662" y="81">712 questions</text>
<text class="s" x="662" y="98">400 text · 312 photo</text>
<text class="s" x="662" y="115">SHA-256 locked first</text>
<rect class="b " x="650" y="160" width="170" height="96" rx="6"/>
<text class="t" x="662" y="182">Training set</text>
<text class="s" x="662" y="201">2,639 rows</text>
<text class="s" x="662" y="218">1,479 text · 1,160 photo</text>
<rect class="b " x="850" y="160" width="140" height="96" rx="6"/>
<text class="t" x="862" y="182">Serverless training</text>
<text class="s" x="862" y="201">LoRA r16, α32,</text>
<text class="s" x="862" y="218">lr 1e-4, 1 epoch,</text>
<text class="s" x="862" y="235">batch 16 · $36.20</text>
<path class="a" d="M180,88 L210,88" marker-end="url(#ah)"/>
<path class="a" d="M400,88 L430,88" marker-end="url(#ah)"/>
<path class="a" d="M400,208 L430,208" marker-end="url(#ah)"/>
<path class="a" d="M620,88 L650,88" marker-end="url(#ah)"/>
<path class="a" d="M620,208 L650,208" marker-end="url(#ah)"/>
<path class="a" d="M820,208 L850,208" marker-end="url(#ah)"/>
<rect class="g" x="10" y="296" width="980" height="236" rx="10"/><text class="gl" x="24" y="520">SCORING · same prompt, temperature 0, one saved row per question</text>
<rect class="b " x="26" y="330" width="108" height="62" rx="6"/>
<text class="t" x="38" y="352">Base</text>
<text class="s" x="38" y="371">GLM 5.3 Flash</text>
<rect class="b " x="144" y="330" width="108" height="62" rx="6"/>
<text class="t" x="156" y="352">Rubric</text>
<text class="s" x="156" y="371">base + rubric</text>
<rect class="b " x="262" y="330" width="108" height="62" rx="6"/>
<text class="t" x="274" y="352">Frontier</text>
<text class="s" x="274" y="371">GPT-6.1</text>
<rect class="b " x="380" y="330" width="108" height="62" rx="6"/>
<text class="t" x="392" y="352">Vision LoRA</text>
<text class="s" x="392" y="371">deployed</text>
<rect class="b heavy " x="498" y="330" width="108" height="62" rx="6"/>
<text class="t" x="510" y="352">LoRA+safety</text>
<text class="s" x="510" y="371">+ rules</text>
<rect class="b " x="640" y="330" width="160" height="82" rx="6"/>
<text class="t" x="652" y="352">McNemar</text>
<text class="s" x="652" y="371">exact binomial test</text>
<text class="s" x="652" y="388">on the disagreements</text>
<rect class="b " x="640" y="428" width="160" height="82" rx="6"/>
<text class="t" x="652" y="450">Cluster bootstrap</text>
<text class="s" x="652" y="469">resample 18 scenario</text>
<text class="s" x="652" y="486">clusters × 5,000</text>
<rect class="b heavy " x="830" y="330" width="144" height="180" rx="6"/>
<text class="t" x="842" y="352">Report</text>
<text class="s" x="842" y="371">real gain only if</text>
<text class="s" x="842" y="388">p &lt; 0.05 AND the</text>
<text class="s" x="842" y="405">95% CI excludes 0</text>
<text class="s" x="842" y="422"></text>
<text class="s" x="842" y="439">table · charts ·</text>
<text class="s" x="842" y="456">summary.json</text>
<path class="a" d="M820,88 L836,88 L836,276 L316,276 L316,330" marker-end="url(#ah)"/><rect class="lblbg" x="326.0" y="258.0" width="272.0" height="16"/><text class="al" x="330" y="270" text-anchor="start">every system scores the same locked rows</text>
<path class="a dash" d="M920,256 L920,288 L434,288 L434,330" marker-end="url(#ah)"/>
<path class="a" d="M612,361 L640,370" marker-end="url(#ah)"/>
<path class="a" d="M612,361 L640,468" marker-end="url(#ah)"/>
<path class="a" d="M800,371 L830,390" marker-end="url(#ah)"/>
<path class="a" d="M800,469 L830,450" marker-end="url(#ah)"/></svg>